<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blueprint Compiler Genie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sub-header {
      color: var(--accent-primary);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* Input Grid Section */
    .input-section {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-primary);
      letter-spacing: 0.05em;
    }

    textarea {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 80px;
      transition: all 0.3s;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.1);
    }

    /* Prompt Output Card */
    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.85rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 4px 14px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 20px;
      line-height: 1.5;
      max-height: 600px;
      overflow-y: auto;
    }

    /* Custom scrollbar for prompt box */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
    }

    @media (max-width: 850px) {
      .input-section { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Prompt#9</h1>
      <p class="sub-header">Blueprint Compiler</p>
    </header>

    <div class="input-section">
      <div class="input-group">
        <label>Chapter Name</label>
        <textarea id="val1" placeholder="Enter chapter..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Mapper Findings</label>
        <textarea id="val2" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Asset Extraction Findings</label>
        <textarea id="val3" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Membership Findings</label>
        <textarea id="val4" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Revenue Findings</label>
        <textarea id="val5" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Assessment Findings</label>
        <textarea id="val6" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Practice Findings</label>
        <textarea id="val7" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
      <div class="input-group">
        <label>Moat Findings</label>
        <textarea id="val8" placeholder="Paste findings..." oninput="updatePrompt()"></textarea>
      </div>
    </div>

    <div class="prompt-workflow">
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Unified Chapter Blueprint Prompt</span>
        </div>
        <div class="prompt-content" id="finalPrompt">Loading template...</div>
        <button class="copy-btn" onclick="copyText('finalPrompt', this)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          <span>Copy Complete Prompt</span>
        </button>
      </div>
    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const template = `Blueprint Compiler

Inputs:

Chapter:
[Chapter]

Chapter Mapper Findings:
[Paste Mapper Findings]

Optional Inputs:

Asset Extraction Findings:
[Paste Asset Extraction Findings]

Membership Findings:
[Paste Membership Findings]

Revenue Findings:
[Paste Revenue Findings]

Assessment Findings:
[Paste Assessment Findings]

Practice Findings:
[Paste Practice Findings]

Moat Findings:
[Paste Moat Findings]

Combine all findings into a single creator-facing chapter blueprint.

Output Structure:

1. Chapter Overview

2. Learning Objectives

3. Concept Inventory

4. Learning Progression Map

5. Dependency Map

6. Confusion Heat Map

7. Practice Opportunity Map

8. Assessment Opportunity Map

9. Asset Opportunity Map

10. Membership Opportunity Map

11. Content Opportunity Map

12. Revenue Opportunity Map

13. Moat Opportunity Map

14. Strategic Recommendations

15. Creator Notes

Primary Question:

"How should I approach this chapter and what should I build from it?"`;

    function updatePrompt() {
      const v1 = document.getElementById('val1').value || "[Chapter]";
      const v2 = document.getElementById('val2').value || "[Paste Mapper Findings]";
      const v3 = document.getElementById('val3').value || "[Paste Asset Extraction Findings]";
      const v4 = document.getElementById('val4').value || "[Paste Membership Findings]";
      const v5 = document.getElementById('val5').value || "[Paste Revenue Findings]";
      const v6 = document.getElementById('val6').value || "[Paste Assessment Findings]";
      const v7 = document.getElementById('val7').value || "[Paste Practice Findings]";
      const v8 = document.getElementById('val8').value || "[Paste Moat Findings]";
      
      let updated = template.replace('[Chapter]', v1);
      updated = updated.replace('[Paste Mapper Findings]', v2);
      updated = updated.replace('[Paste Asset Extraction Findings]', v3);
      updated = updated.replace('[Paste Membership Findings]', v4);
      updated = updated.replace('[Paste Revenue Findings]', v5);
      updated = updated.replace('[Paste Assessment Findings]', v6);
      updated = updated.replace('[Paste Practice Findings]', v7);
      updated = updated.replace('[Paste Moat Findings]', v8);
      
      document.getElementById('finalPrompt').innerText = updated;
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display
    updatePrompt();
  </script>
</body>
</html>
